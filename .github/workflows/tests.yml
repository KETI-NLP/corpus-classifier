name: CPU orchestration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies and package
        run: |
          python -m pip install build pyarrow==23.0.0 zstandard==0.25.0
          python -m pip install --no-deps .
      - name: Run synthetic CPU tests
        run: python -m unittest discover -s tests -v
      - name: Build distributable wheel
        run: python -m build --wheel
